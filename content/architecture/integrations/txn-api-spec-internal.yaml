          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
        required: true
      responses:
        '201':
          description: Successful response model
          content:
            application/json:
