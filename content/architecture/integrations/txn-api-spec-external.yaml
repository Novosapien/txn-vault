            type: string
            format: uuid
        - name: cardHolderGroupId
          in: path
          description: Cardholder group identifier from the route.
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page number.
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Page size for the result set.
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
