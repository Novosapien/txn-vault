openapi: 3.0.4
info:
  title: TxnGlobal.API
  description: This is the global APIs for the TXN system
  license:
    name: Direct Transact
    url: https://www.directtransact.co.za/
  version: v1
paths:
  /accounts:
    post:
      tags:
        - Account
      summary: Creates a new account and links the owner and members. Generates a unique account number.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        '201':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    get:
      tags:
        - Account
      summary: 'Paginated, sortable list of accounts. Accepts page, limit, sortingParameters directly.'
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page index.
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            format: int32
            default: 10
        - name: sortingParameters
          in: query
          description: Optional sort expression.
          schema:
            type: string
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAccountsResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/accounts/{accountId}':
    get:
      tags:
        - Account
      summary: Retrieve a single account by accountId. Projects camelCase response DTO shape.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountByIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    put:
      tags:
        - Account
      summary: PATCH-style partial update of an account. Updates account membership when accountMembers or accountOwnerId are provided.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/accounts/{accountId}/balance':
