        - Account
      summary: Adjust an account's balance (operational tool for manual reconciliation).
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBalanceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBalanceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBalanceRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountBalanceResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/accounts/{accountId}/transitions':
    get:
      tags:
        - Account
      summary: 'Retrieves paginated account lifecycle transition history for an account (previous and new statuses, actor, timestamps).'
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: Optional correlation identifier for distributed tracing.
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Account unique identifier from the route.
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page index.
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
          in: query
          description: 'Sort expression (default: created_at:desc).'
          schema:
            type: string
            default: created_at:desc
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountTransitionsByAccountIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    post:
      tags:
        - Account
      summary: Creates an account lifecycle transition for the specified account.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountTransitionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateAccountTransitionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateAccountTransitionRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountTransitionResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/accounts/transitions/{transitionId}':
    get:
