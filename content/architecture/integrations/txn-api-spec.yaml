  /binsponsor:
    post:
      tags:
        - BinSponsor
      summary: "Creates a new BIN sponsor. Persists a lookups.mbl_Master_Branch_Lookup\r\nrow (the sponsor identity) + a binsponsor.bsf_BinSponsor_Settlement_File\r\nrow (its settlement profile)."
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinSponsorRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateBinSponsorRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateBinSponsorRequest'
        required: true
      responses:
        '201':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBinSponsorResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/binsponsor/{binSponsorId}':
    get:
      tags:
        - BinSponsor
      summary: "Retrieve a single BIN sponsor by id, joining the sponsor identity\r\n(mbl) with its settlement profile (bsf)."
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: binSponsorId
          in: path
          description: Route parameter `binSponsorId`.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBinSponsorByIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    put:
      tags:
        - BinSponsor
      summary: 'Update a BIN sponsor''s name, status, and settlement profile.'
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: binSponsorId
          in: path
          description: Route parameter `binSponsorId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
