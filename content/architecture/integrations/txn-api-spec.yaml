        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  /binrange:
    post:
      tags:
        - BinRange
      summary: Reserves a contiguous range of card numbers under one BIN.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
