    SimulateTransactionRequest:
      required:
        - acquirerId
        - amount
        - appliedBy
        - cardholderBillingAmount
        - cardholderBillingConversionRate
        - cardholderBillingCurrency
        - cardId
        - currency
        - ecommerceAuthenticationIndicator
        - merchantId
        - operation
        - originalTransactionAmount
        - originalTransactionCurrency
        - transactionAmounts
        - transactionType
        - type
      type: object
      properties:
        transactionType:
          minLength: 1
          type: string
          description: Single transaction type to test.
          example: AUTHORIZATION
        cardId:
          type: string
          description: Card ID to use for test transaction.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        transactionAmounts:
          description: Amounts involved in the transaction and conversions.
          example:
            attributeName: attributeValue
        originalTransactionCurrency:
          minLength: 1
          type: string
          description: Currency in which the transaction was originally made.
          example: USD
        originalTransactionAmount:
          minLength: 1
          type: string
          description: Original amount of the transaction.
          example: '114.00'
        cardholderBillingCurrency:
          minLength: 1
          type: string
          description: Currency used for billing the cardholder.
          example: EUR
        cardholderBillingAmount:
          minLength: 1
          type: string
          description: Amount billed to the cardholder in their billing currency.
          example: '100.00'
        cardholderBillingCashbackAmount:
          type: string
          description: Cashback Amount billed to the cardholder in their billing currency.
          nullable: true
          example: '100.00'
        cardholderBillingConversionRate:
          minLength: 1
          type: string
          description: Conversion rate used from original currency to billing currency.
          example: '1.00'
        settlementCurrency:
          type: string
          description: Currency used for settlement.
          nullable: true
          example: USD
        settlementAmount:
          type: string
          description: Amount settled in settlement currency.
          nullable: true
          example: '100.00'
        settlementConversionRate:
          type: string
          description: Conversion rate used from billing currency to settlement currency.
          nullable: true
          example: sample
        impactedAuthorizationId:
          type: string
          description: Custom authorization ID to reference in test.
          format: uuid
          nullable: true
          example: 00000000-0000-0000-0000-000000000000
        transactionFees:
          type: array
          items: { }
          description: List of fees applied to the transaction.
          nullable: true
        type:
          minLength: 1
          type: string
          description: Type of the fee. Additional interchange fee types are applicable only for issuer processors.
          example: INTERCHANGE
        amount:
          minLength: 1
          type: string
          description: Fee amount.
          example: '100.00'
        currency:
          minLength: 1
          type: string
          description: Currency of the fee amount.
          example: ZAR
        operation:
          minLength: 1
          type: string
          description: Operation of the fee.
          example: DEBIT
        appliedBy:
          minLength: 1
          type: string
          description: Entity that applied the fee.
          example: ISSUER
        transactionAuthentication:
          description: Authentication details for the transaction.
          nullable: true
          example:
            attributeName: attributeValue
        ecommerceAuthenticationIndicator:
          minLength: 1
          type: string
          description: Indicator of ecommerce authentication status.
          example: '05'
        authenticationId:
          type: string
          description: Authentication identifier.
          format: uuid
          nullable: true
          example: 00000000-0000-0000-0000-000000000000
        processorExemptions:
          type: array
          items:
            type: string
          description: List of processor exemption reasons.
          nullable: true
          example:
            - sample
        acquirerExemptions:
          type: array
          items:
            type: string
          description: List of acquirer exemption reasons.
          nullable: true
          example:
            - sample
        transactionAttributes:
          description: Additional attributes related to the transaction.
          nullable: true
          example:
            attributeName: attributeValue
        transactionChannel:
          type: string
          description: 'Channel through which transaction was performed (e.g., ECOMMERCE).'
          nullable: true
          example: sample
        recurring:
          type: boolean
          description: Flag indicating if transaction is recurring.
          nullable: true
          example: true
        cashback:
          type: boolean
          description: Flag indicating if transaction is cashback transaction.
          nullable: true
          example: true
        quasiCash:
          type: boolean
          description: Flag indicating if transaction is quasi cash transaction.
          nullable: true
          example: true
        network:
          description: Network information related to the transaction.
          nullable: true
          example:
            attributeName: attributeValue
        name:
          type: string
          description: 'Name of the card network (e.g., VISA).'
          nullable: true
          example: Sample name
        transactionId:
          type: string
          description: Identifier provided by the network for the transaction.
          format: uuid
          nullable: true
          example: 00000000-0000-0000-0000-000000000000
        incomingResponseCode:
          type: string
          description: Incoming response code from the network for the transaction.
          nullable: true
          example: sample
        acquirer:
          description: Acquirer details processing the transaction.
          nullable: true
          example:
            attributeName: attributeValue
        acquirerReferenceNumber:
          type: string
          description: Reference number from the acquirer.
          nullable: true
          example: sample
        acquirerId:
          minLength: 1
          type: string
          description: Acquirer identifier.
          example: 123e4567-e89b-12d3-a456-426614174000
        merchant:
          description: Merchant details where the transaction took place.
          nullable: true
          example:
            attributeName: attributeValue
        merchantId:
          minLength: 1
          type: string
          description: Unique identifier of the merchant.
          example: '479823100583614'
        merchantCategoryCode:
          type: string
          description: Merchant category code (MCC).
          nullable: true
          example: '5651'
        merchantName:
          type: string
          description: Merchant name.
          nullable: true
          example: Test Merchant
        city:
          type: string
          description: City or municipality name for the merchant address location.
          nullable: true
          example: My City
        state:
          type: string
          description: Merchant state or province.
          nullable: true
          example: My State
        postalCode:
          type: string
          description: 'Postal code, ZIP code, or equivalent for the merchant address location.'
          nullable: true
          example: '2000'
        countryCode:
          type: string
          description: ISO country code for the merchant location.
          nullable: true
          example: sample
      additionalProperties: false
      description: Simulate a transaction end-to-end through the issuer pipeline.
