openapi: 3.0.4
info:
  title: DirectTransact.TxnGlobal.API
  description: This is the global APIs for the TXN system
  license:
    name: Direct Transact
    url: https://www.directtransact.co.za/
  version: v1
paths:
  /account:
    post:
      tags:
        - Account
      summary: "Creates a new account in accounthosting.ana_Acc_No_Alloc and links the\r\nowner + members to cardholder.cpf_Client_Profile via cac_Client_Accounts.\r\nGenerates an internal account number that does not collide with existing rows."
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        '201':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/account/{accountId}':
    get:
      tags:
        - Account
      summary: Retrieve a single account by accountId. Projects camelCase response DTO shape.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountByIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    put:
      tags:
        - Account
      summary: PATCH-style partial update of an account. Re-links cac_Client_Accounts when accountMembers/accountOwnerId present.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  /account/accounts:
    get:
      tags:
        - Account
      summary: 'Paginated, sortable list of accounts. Accepts page, limit, sortingParameters directly.'
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page index.
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            format: int32
            default: 50
        - name: sortingParameters
          in: query
          description: Optional sort expression.
          schema:
            type: string
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAccountsResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/account/{accountId}/balance':
    get:
      tags:
        - Account
      summary: Read the current balance for an account (computed from asd_Acc_Stats_Daily).
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountBalanceResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    put:
      tags:
        - Account
      summary: Adjust an account's balance (operational tool for manual reconciliation).
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBalanceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBalanceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBalanceRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountBalanceResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/account/{accountId}/transitions':
    get:
      tags:
        - Account
      summary: 'Retrieves paginated account lifecycle transition history for an account (previous and new statuses, actor, timestamps).'
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: Optional correlation identifier for distributed tracing.
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Account unique identifier from the route.
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page index.
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Page size for the result set.
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
          in: query
          description: Sort field and direction.
          schema:
            type: string
            default: created_at:desc
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountTransitionsByAccountIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/account/{accountId}/transition':
    post:
      tags:
        - Account
      summary: Creates an account lifecycle transition for the specified account.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountTransitionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateAccountTransitionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateAccountTransitionRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountTransitionResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/account/{accountId}/transitions/{transitionId}':
    get:
      tags:
        - Account
      summary: Retrieve a single status transition row by accountId + transitionId.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          description: Route parameter `accountId`.
          required: true
          schema:
            type: string
            format: uuid
        - name: transitionId
          in: path
          description: Route parameter `transitionId`.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountTransitionByIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  /alerts:
    get:
      tags:
        - Alert
      summary: "Paginated list of triggered alerts. Each row exposes the alert id,\r\ntype, optional cardholder + program scope, description / metric /\r\nchange-percent payload, and the trigger + creation timestamps."
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page index.
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            format: int32
            default: 50
        - name: sortingParameters
          in: query
          description: Optional sort expression.
          schema:
            type: string
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAlertsResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  /api-specification.yml:
    get:
      tags:
        - ApiSpecification
      summary: Retrieve the api specifications yaml file
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier for tracking the request across systems (from header, optional).'
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
        '500':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  /bin:
    post:
      tags:
        - Bin
      summary: Creates a BIN link tying a BinSponsor + product to issuance.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateBinRequest'
        required: true
      responses:
        '201':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBinResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  '/bin/{binId}':
    put:
      tags:
        - Bin
      summary: Update an existing BIN link.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: binId
          in: path
          description: Route parameter `binId`.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBinRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateBinRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateBinRequest'
        required: true
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBinResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
    get:
      tags:
        - Bin
      summary: Retrieve a single BIN by id.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: header
          description: 'Correlation identifier (from header, optional).'
          schema:
            type: string
            format: uuid
        - name: binId
          in: path
          description: Route parameter `binId`.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBinByIdResponseBaseResponseModel'
        '400':
          description: Unsuccessful response model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBaseResponseModel'
  /bins:
    get:
      tags:
        - Bin
      summary: Paginated list of BINs.
      parameters:
        - name: requestId
          in: header
          description: Unique identifier for the request (from header).
          required: true
          schema:
            type: string
            format: uuid
        - name: correlationId
